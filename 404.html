*{box-sizing:border-box}body{margin:0;background:#eef2f4;color:#273d4c;font:400 18px/1.8 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:break-word}
main{min-height:100svh;display:grid;place-items:center;padding:clamp(24px,6vw,80px)}
.error-card{width:min(960px,100%);padding:clamp(28px,6vw,76px);background:#fff;border:1px solid #d2dfe5;border-radius:24px;box-shadow:0 25px 80px #263b4810}
.error-brand{display:flex;align-items:center;gap:12px}.error-brand img{width:39px;height:39px;object-fit:contain}.error-brand small{display:block;font-size:12px;line-height:1.7;color:#52616a}.error-brand strong{display:block;font-size:22px;line-height:1.4;letter-spacing:-.05em}
.error-code{display:inline-block;margin:50px 0 16px;padding:5px 14px;border-radius:5px;background:#eaf1f5;font-size:15px;font-weight:600;letter-spacing:.08em;color:#3e6076}
h1{margin:0 0 24px;font-size:clamp(30px,4vw,44px);line-height:1.5;letter-spacing:-.05em;font-weight:600}p{margin:0;color:#52616a;max-width:600px}
.error-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px}.error-actions a{display:inline-flex;align-items:center;justify-content:space-between;gap:26px;padding:14px 24px;border-radius:7px;border:1px solid #273d4c;color:#fff;background:#273d4c;font-size:17px;font-weight:600;text-decoration:none;min-height:56px}.error-actions .error-call{background:#fff;color:#36586f;border-color:#b0c4cf}.error-actions a:hover{background:#36586f;color:#fff}.error-actions a:focus-visible{outline:3px solid #427c97;outline-offset:5px}
.error-note{border-top:1px solid #d7e1e6;padding-top:24px;margin-top:42px;font-size:15px;line-height:1.9}
